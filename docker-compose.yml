services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1ink-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8008}:8008"
    depends_on:
      - ws-server
    volumes:
      - static_data:/app/static
    environment:
      BACKEND_LISTEN_ADDR: ":8008"
      BACKEND_STATIC_DIR: "/app/static"
      BACKEND_UPDATE_DIR: "/app/static/update"
      BACKEND_TRUSTED_PROXIES: "${BACKEND_TRUSTED_PROXIES:-all}"
      BACKEND_LOG_REQUESTS: "${BACKEND_LOG_REQUESTS:-1}"
      BACKEND_REQUIRE_MYSQL: "${BACKEND_REQUIRE_MYSQL:-1}"
      BACKEND_ADMIN_TOKEN: "${BACKEND_ADMIN_TOKEN:-}"
      WS_SERVER_BASE_URL: "http://ws-server:8009"
      WS_SERVER_INTERNAL_TOKEN: "${WS_SERVER_INTERNAL_TOKEN:-}"
      TOINC_F1_MYSQL_ENABLED: "${TOINC_F1_MYSQL_ENABLED:-1}"
      TOINC_F1_MYSQL_HOST: "${TOINC_F1_MYSQL_HOST:-192.168.31.110}"
      TOINC_F1_MYSQL_PORT: "${TOINC_F1_MYSQL_PORT:-3306}"
      TOINC_F1_MYSQL_USER: "${TOINC_F1_MYSQL_USER:-root}"
      TOINC_F1_MYSQL_PASSWORD: "${TOINC_F1_MYSQL_PASSWORD:-123456}"
      TOINC_F1_MYSQL_DB: "${TOINC_F1_MYSQL_DB:-toinc_F1}"
      TOINC_F1_MYSQL_CHARSET: "${TOINC_F1_MYSQL_CHARSET:-utf8mb4}"
      WECHAT_MINI_ENABLED: "${WECHAT_MINI_ENABLED:-0}"
      WECHATPAY_ENABLED: "${WECHATPAY_ENABLED:-0}"
      NEWS_WS_ENABLED: "${NEWS_WS_ENABLED:-0}"
      NEWS_INGEST_TOKEN: "${NEWS_INGEST_TOKEN:-}"
      OPENF1_ENABLED: "${OPENF1_ENABLED:-0}"
      OPENF1_INGEST_TOKEN: "${OPENF1_INGEST_TOKEN:-}"
      OPENF1_SCHEDULER_ENABLED: "${OPENF1_SCHEDULER_ENABLED:-0}"
      MP_NEWS_SCHEDULER_ENABLED: "${MP_NEWS_SCHEDULER_ENABLED:-0}"
      MOTORSPORT_RESULTS_SCHEDULER_ENABLED: "${MOTORSPORT_RESULTS_SCHEDULER_ENABLED:-0}"
      MOTORSPORT_RESULTS_SCHEDULER_PYTHON: "${MOTORSPORT_RESULTS_SCHEDULER_PYTHON:-python}"
      MOTORSPORT_RESULTS_SCHEDULER_SCRIPT: "${MOTORSPORT_RESULTS_SCHEDULER_SCRIPT:-scripts/motorsport_results_crawl.py}"
      OPENF1_SCHEDULER_PYTHON: "${OPENF1_SCHEDULER_PYTHON:-python}"
      OPENF1_SCHEDULER_SCRIPT: "${OPENF1_SCHEDULER_SCRIPT:-scripts/openf1_sync_all_mysql.py}"
      F1_LIVE_TIMING_ENABLED: "${F1_LIVE_TIMING_ENABLED:-1}"
      F1_LIVE_TIMING_GRAPHQL_ENDPOINT: "${F1_LIVE_TIMING_GRAPHQL_ENDPOINT:-http://localhost:10457/api/graphql}"
      F1_LIVE_TIMING_POLL_INTERVAL_MS: "${F1_LIVE_TIMING_POLL_INTERVAL_MS:-100}"
      F1_LIVE_TIMING_REQUEST_TIMEOUT_MS: "${F1_LIVE_TIMING_REQUEST_TIMEOUT_MS:-2000}"
      F1_LIVE_TIMING_SCHEDULE_ENABLED: "${F1_LIVE_TIMING_SCHEDULE_ENABLED:-1}"
      F1_LIVE_TIMING_SCHEDULE_START_BEFORE_MIN: "${F1_LIVE_TIMING_SCHEDULE_START_BEFORE_MIN:-30}"
      F1_LIVE_TIMING_SCHEDULE_STOP_AFTER_MIN: "${F1_LIVE_TIMING_SCHEDULE_STOP_AFTER_MIN:-60}"
      F1_LIVE_TIMING_SCHEDULE_INTERVAL_SEC: "${F1_LIVE_TIMING_SCHEDULE_INTERVAL_SEC:-30}"
      MOTORSPORT_LIVE_ENABLED: "${MOTORSPORT_LIVE_ENABLED:-1}"
      MOTORSPORT_LIVE_WS_URL: "${MOTORSPORT_LIVE_WS_URL:-wss://livetiming.motorsport.com:8080/782178-full/}"
      MOTORSPORT_LIVE_ORIGIN: "${MOTORSPORT_LIVE_ORIGIN:-https://www.motorsport.com}"
      MOTORSPORT_LIVE_USER_AGENT: "${MOTORSPORT_LIVE_USER_AGENT:-}"
      MOTORSPORT_LIVE_RECENT_LIMIT: "${MOTORSPORT_LIVE_RECENT_LIMIT:-20}"
      MOTORSPORT_LIVE_CONNECT_BEFORE_MIN: "${MOTORSPORT_LIVE_CONNECT_BEFORE_MIN:-30}"
      MOTORSPORT_LIVE_RECONNECT_INTERVAL_SEC: "${MOTORSPORT_LIVE_RECONNECT_INTERVAL_SEC:-120}"
      MOTORSPORT_LIVE_SCHEDULE_ENABLED: "${MOTORSPORT_LIVE_SCHEDULE_ENABLED:-1}"
      MOTORSPORT_LIVE_SCHEDULE_START_BEFORE_MIN: "${MOTORSPORT_LIVE_SCHEDULE_START_BEFORE_MIN:-30}"
      MOTORSPORT_LIVE_SCHEDULE_STOP_AFTER_MIN: "${MOTORSPORT_LIVE_SCHEDULE_STOP_AFTER_MIN:-60}"
      MOTORSPORT_LIVE_SCHEDULE_INTERVAL_SEC: "${MOTORSPORT_LIVE_SCHEDULE_INTERVAL_SEC:-30}"

  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    container_name: f1ink-ws-server
    restart: unless-stopped
    ports:
      - "${WS_SERVER_PORT:-8009}:8009"
    volumes:
      - static_data:/app/static:ro
    environment:
      WS_SERVER_LISTEN_ADDR: ":8009"
      WS_SERVER_STATIC_DIR: "/app/static"
      WS_SERVER_TRUSTED_PROXIES: "${WS_SERVER_TRUSTED_PROXIES:-all}"
      WS_SERVER_LOG_REQUESTS: "${WS_SERVER_LOG_REQUESTS:-1}"
      WS_SERVER_REQUIRE_MYSQL: "${WS_SERVER_REQUIRE_MYSQL:-1}"
      WS_SERVER_INTERNAL_TOKEN: "${WS_SERVER_INTERNAL_TOKEN:-}"
      BACKEND_ADMIN_TOKEN: "${BACKEND_ADMIN_TOKEN:-}"
      TOINC_F1_MYSQL_ENABLED: "${TOINC_F1_MYSQL_ENABLED:-1}"
      TOINC_F1_MYSQL_HOST: "${TOINC_F1_MYSQL_HOST:-192.168.31.110}"
      TOINC_F1_MYSQL_PORT: "${TOINC_F1_MYSQL_PORT:-3306}"
      TOINC_F1_MYSQL_USER: "${TOINC_F1_MYSQL_USER:-root}"
      TOINC_F1_MYSQL_PASSWORD: "${TOINC_F1_MYSQL_PASSWORD:-123456}"
      TOINC_F1_MYSQL_DB: "${TOINC_F1_MYSQL_DB:-toinc_F1}"
      TOINC_F1_MYSQL_CHARSET: "${TOINC_F1_MYSQL_CHARSET:-utf8mb4}"
      NEWS_WS_ENABLED: "${NEWS_WS_ENABLED:-0}"
      NEWS_INGEST_TOKEN: "${NEWS_INGEST_TOKEN:-}"
      OPENF1_ENABLED: "${OPENF1_ENABLED:-0}"
      OPENF1_MODE: "${OPENF1_MODE:-mock}"
      OPENF1_INGEST_TOKEN: "${OPENF1_INGEST_TOKEN:-}"
      F1_LIVE_TIMING_ENABLED: "${F1_LIVE_TIMING_ENABLED:-1}"
      F1_LIVE_TIMING_GRAPHQL_ENDPOINT: "${F1_LIVE_TIMING_GRAPHQL_ENDPOINT:-http://localhost:10457/api/graphql}"
      F1_LIVE_TIMING_POLL_INTERVAL_MS: "${F1_LIVE_TIMING_POLL_INTERVAL_MS:-100}"
      F1_LIVE_TIMING_REQUEST_TIMEOUT_MS: "${F1_LIVE_TIMING_REQUEST_TIMEOUT_MS:-2000}"
      F1_LIVE_TIMING_SCHEDULE_ENABLED: "${F1_LIVE_TIMING_SCHEDULE_ENABLED:-1}"
      F1_LIVE_TIMING_SCHEDULE_START_BEFORE_MIN: "${F1_LIVE_TIMING_SCHEDULE_START_BEFORE_MIN:-30}"
      F1_LIVE_TIMING_SCHEDULE_STOP_AFTER_MIN: "${F1_LIVE_TIMING_SCHEDULE_STOP_AFTER_MIN:-60}"
      F1_LIVE_TIMING_SCHEDULE_INTERVAL_SEC: "${F1_LIVE_TIMING_SCHEDULE_INTERVAL_SEC:-30}"
      MOTORSPORT_LIVE_ENABLED: "${MOTORSPORT_LIVE_ENABLED:-1}"
      MOTORSPORT_LIVE_WS_URL: "${MOTORSPORT_LIVE_WS_URL:-wss://livetiming.motorsport.com:8080/782178-full/}"
      MOTORSPORT_LIVE_ORIGIN: "${MOTORSPORT_LIVE_ORIGIN:-https://www.motorsport.com}"
      MOTORSPORT_LIVE_USER_AGENT: "${MOTORSPORT_LIVE_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36}"
      MOTORSPORT_LIVE_RECENT_LIMIT: "${MOTORSPORT_LIVE_RECENT_LIMIT:-20}"
      MOTORSPORT_LIVE_CONNECT_BEFORE_MIN: "${MOTORSPORT_LIVE_CONNECT_BEFORE_MIN:-30}"
      MOTORSPORT_LIVE_RECONNECT_INTERVAL_SEC: "${MOTORSPORT_LIVE_RECONNECT_INTERVAL_SEC:-120}"
      MOTORSPORT_LIVE_SCHEDULE_ENABLED: "${MOTORSPORT_LIVE_SCHEDULE_ENABLED:-1}"
      MOTORSPORT_LIVE_SCHEDULE_START_BEFORE_MIN: "${MOTORSPORT_LIVE_SCHEDULE_START_BEFORE_MIN:-30}"
      MOTORSPORT_LIVE_SCHEDULE_STOP_AFTER_MIN: "${MOTORSPORT_LIVE_SCHEDULE_STOP_AFTER_MIN:-60}"
      MOTORSPORT_LIVE_SCHEDULE_INTERVAL_SEC: "${MOTORSPORT_LIVE_SCHEDULE_INTERVAL_SEC:-30}"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "${ADMIN_VITE_API_BASE:-http://192.168.31.110:8008}"
    container_name: f1ink-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-8080}:80"

  charts:
    build:
      context: ./charts
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "${CHARTS_VITE_API_BASE:-http://192.168.31.110:8008}"
    container_name: f1ink-charts
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CHARTS_PORT:-8081}:80"

volumes:
  static_data:
    driver: local
