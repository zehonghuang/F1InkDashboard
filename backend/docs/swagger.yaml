basePath: /
definitions:
  internal_httpserver_handlers.ErrorResponse:
    properties:
      error:
        type: string
      ok:
        type: boolean
    type: object
  internal_httpserver_handlers.GenericObject:
    additionalProperties: {}
    type: object
  internal_httpserver_handlers.MpAuthLoginResponse:
    properties:
      expiresAt:
        type: string
      ok:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/internal_httpserver_handlers.MpAuthUser'
    type: object
  internal_httpserver_handlers.MpAuthUser:
    properties:
      id:
        type: integer
      openid:
        type: string
    type: object
  internal_httpserver_handlers.NewsIngestJSONBody:
    properties:
      payload:
        additionalProperties: {}
        type: object
      topic:
        type: string
    type: object
  internal_httpserver_handlers.OkResponse:
    properties:
      ok:
        type: boolean
    type: object
  internal_httpserver_handlers.WechatPayJSAPIPrepayRequest:
    properties:
      attach:
        type: string
      currency:
        type: string
      description:
        type: string
      openid:
        type: string
      out_trade_no:
        type: string
      total:
        type: integer
    type: object
  internal_httpserver_handlers.WsBroadcastResponse:
    properties:
      ok:
        type: boolean
      sent:
        type: integer
    type: object
  internal_httpserver_handlers.WsStatusResponse:
    properties:
      clients:
        type: integer
      ok:
        type: boolean
    type: object
  internal_httpserver_handlers.deviceBootRequest:
    properties:
      board_type:
        type: string
      device_id:
        type: string
      device_key:
        type: string
      device_uuid:
        type: string
      fw_user_agent:
        type: string
      mac:
        type: string
    type: object
  internal_httpserver_handlers.mpAuthBindDeviceRequest:
    properties:
      device_id:
        type: string
    type: object
  internal_httpserver_handlers.mpAuthLoginRequest:
    properties:
      code:
        type: string
    type: object
  internal_httpserver_handlers.mpAuthUpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      nick_name:
        type: string
    type: object
  internal_httpserver_handlers.mpPrefsUpdateRequest:
    properties:
      driver_numbers:
        items:
          type: integer
        type: array
      team_keys:
        items:
          type: string
        type: array
      team_name:
        type: string
    type: object
info:
  contact: {}
  description: 后端基于 Gin 的 HTTP API 文档（swaggo/swag 自动生成）。
  title: F1InkDashboard Backend API
  version: 1.0.0
paths:
  /api/v1/charts/driver/{driver_number}/latest.json:
    get:
      description: '|'
      parameters:
      - description: 车手号码
        in: path
        name: driver_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
      summary: 获取车手最新图表 JSON
      tags:
      - Charts
  /api/v1/charts/driver/{driver_number}/latest.png:
    get:
      description: 从静态目录中选择最新的图表 PNG（优先 fastest_lap_*）。
      parameters:
      - description: 车手号码
        in: path
        name: driver_number
        required: true
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
      summary: 获取车手最新图表 PNG
      tags:
      - Charts
  /api/v1/device/{device_id}/user_prefs_kv:
    get:
      description: 返回该 device_id 绑定用户的偏好（nick/avatar/team/teams/drivers）。
      parameters:
      - description: 设备 ID
        in: path
        name: device_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 获取设备绑定用户偏好 KV
      tags:
      - Device
  /api/v1/device/boot:
    post:
      consumes:
      - application/json
      description: 设备开机后上报自身信息，用于记录 boot report，并作为后续绑定校验依据。
      parameters:
      - description: 设备启动信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpserver_handlers.deviceBootRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 设备启动上报
      tags:
      - Device
  /api/v1/epd/frame.bin:
    get:
      description: 从 png_url 拉取图片，按给定宽高缩放并生成 1bpp 黑白 bin 数据。
      parameters:
      - description: 源 PNG 图片 URL（服务端会拉取该资源）
        in: query
        name: png_url
        required: true
        type: string
      - default: 1
        description: 目标宽度像素（1-1200）
        in: query
        name: w
        type: integer
      - default: 1
        description: 目标高度像素（1-1200）
        in: query
        name: h
        type: integer
      - description: 抖动开关：传 1/true 开启
        in: query
        name: dither
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 生成电子纸 bin 帧
      tags:
      - EPD
  /api/v1/epd/frame.png:
    get:
      description: 与 frame.bin 相同逻辑，但返回 PNG 预览图（便于调试显示效果）。
      parameters:
      - description: 源 PNG 图片 URL（服务端会拉取该资源）
        in: query
        name: png_url
        required: true
        type: string
      - default: 1
        description: 目标宽度像素（1-1200）
        in: query
        name: w
        type: integer
      - default: 1
        description: 目标高度像素（1-1200）
        in: query
        name: h
        type: integer
      - description: 抖动开关：传 1/true 开启
        in: query
        name: dither
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 生成电子纸预览 PNG
      tags:
      - EPD
  /api/v1/f1/sessions:
    get:
      parameters:
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      - default: 2026
        description: 赛季年份
        in: query
        name: season
        type: integer
      - description: 分站 round（1-30）
        in: query
        name: round
        type: integer
      - default: auto
        description: session 名称过滤；auto 表示按当前时间选择
        in: query
        name: session
        type: string
      - description: 排位分段（1-3）
        in: query
        name: q
        type: integer
      - default: 13
        description: 返回数量限制（1-30）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 查询 session 列表
      tags:
      - Sessions
  /api/v1/f1/sessions/{season}/{round}/{session_name}:
    get:
      description: 读取静态 session 文件（session_name 会自动去掉 .json 后缀）。
      parameters:
      - description: 赛季年份
        in: path
        name: season
        required: true
        type: integer
      - description: 分站 round（1-30）
        in: path
        name: round
        required: true
        type: integer
      - description: session 名称（可带 .json）
        in: path
        name: session_name
        required: true
        type: string
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      - description: 排位分段（1-3）
        in: query
        name: q
        type: integer
      - default: 13
        description: 返回数量限制（1-30）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 按路径获取 session 文件
      tags:
      - Sessions
  /api/v1/f1/sessions/current:
    get:
      description: 固定 session=auto，语义等价于 /api/v1/f1/sessions?session=auto。
      parameters:
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      - default: 2026
        description: 赛季年份
        in: query
        name: season
        type: integer
      - description: 分站 round（1-30）
        in: query
        name: round
        type: integer
      - description: 排位分段（1-3）
        in: query
        name: q
        type: integer
      - default: 13
        description: 返回数量限制（1-30）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 当前 session（显式 current）
      tags:
      - Sessions
  /api/v1/mp/archive:
    get:
      description: 返回历史比赛列表（包含 winner/fastest_lap/circuit map url 等）。
      parameters:
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      - default: 2026
        description: 赛季年份
        in: query
        name: season
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 历史赛历归档
      tags:
      - MiniProgram
  /api/v1/mp/auth/avatar:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 头像图片文件
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 上传用户头像
      tags:
      - MiniProgramAuth
  /api/v1/mp/auth/bind_device:
    post:
      consumes:
      - application/json
      description: 绑定前要求设备已调用 /api/v1/device/boot 上报（后端会校验 boot report 存在）。
      parameters:
      - description: 绑定请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpserver_handlers.mpAuthBindDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 绑定设备
      tags:
      - MiniProgramAuth
  /api/v1/mp/auth/login:
    post:
      consumes:
      - application/json
      description: 使用 wx.login 获取的 code 换取 openid 并返回后端 token。
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpserver_handlers.mpAuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.MpAuthLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 小程序登录
      tags:
      - MiniProgramAuth
  /api/v1/mp/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - MiniProgramAuth
  /api/v1/mp/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - MiniProgramAuth
  /api/v1/mp/auth/prefs:
    get:
      description: 返回当前登录用户的偏好（车队/车手关注列表）及附加展示信息。
      parameters:
      - description: 返回格式版本（用于兼容旧版小程序）
        in: query
        name: v
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户偏好
      tags:
      - MiniProgramAuth
    put:
      consumes:
      - application/json
      description: team_keys/driver_numbers 会去重、排序，并最多保留 12 个。
      parameters:
      - description: 返回格式版本（用于兼容旧版小程序）
        in: query
        name: v
        type: string
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpserver_handlers.mpPrefsUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新用户偏好
      tags:
      - MiniProgramAuth
  /api/v1/mp/auth/profile:
    post:
      consumes:
      - application/json
      description: nick_name/avatar_url 至少传一个非空。
      parameters:
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpserver_handlers.mpAuthUpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新用户资料
      tags:
      - MiniProgramAuth
  /api/v1/mp/news:
    get:
      description: 分页返回新闻条目列表（不包含 content）。
      parameters:
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量（最大 50）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 小程序新闻列表
      tags:
      - MiniProgram
  /api/v1/mp/news/{id}:
    get:
      description: 返回指定 id 的新闻详情（包含 content）。
      parameters:
      - description: 新闻 ID
        in: path
        name: id
        required: true
        type: string
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 小程序新闻详情
      tags:
      - MiniProgram
  /api/v1/mp/race-sessions:
    get:
      description: 返回该分站 FP/Q/RACE 等 sessions 列表与 openf1_session_key。
      parameters:
      - default: Asia/Shanghai
        description: IANA 时区名称
        in: query
        name: tz
        type: string
      - default: 2026
        description: 赛季年份
        in: query
        name: season
        type: integer
      - description: 分站 round（1 开始）
        in: query
        name: round
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: 分站 Session 列表
      tags:
      - MiniProgram
  /api/v1/mp/session-results:
    get:
      description: 返回该 session 排名 + 最快圈等（会拼装车手/车队信息）。
      parameters:
      - description: OpenF1 session_key
        in: query
        name: session_key
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.GenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_httpserver_handlers.ErrorResponse'
      summary: Session 成绩
      tags:
      - MiniProgram
  /api/v1/mp/telemetry/controls:
    get:
      description: 返回 points[{t, throttle, brake}]。
      parameters:
      - description: OpenF1 session_key
        in: query
        name: session_key
        required: true
        type: integer
      - description: 车手号码
        in: query
        name: driver_number
        required: true
        type: integer
      - default: 320
        description: 采样点数（最大 900）
        in: query
        name: "n"
        type: integer
      - default: fastest
        description: 选择圈：fastest/all 等
        in: query
        name: lap
        type: string
      - description: 指定圈号
        in: query
